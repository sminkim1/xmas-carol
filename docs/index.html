<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>첫눈 캐롤</title>
<meta name="description" content="코드로 칠한 인상파 크리스마스 캐롤 숏츠" />
<style>
  @font-face { font-family: "Jua"; font-weight: 400; src: url("assets/fonts/Jua-Regular.ttf"); }
  @font-face { font-family: "Mountains of Christmas"; font-weight: 700; src: url("assets/fonts/MountainsofChristmas-Bold.ttf"); }
  :root { --ground: #0b1428; --ink: #fff6e0; --accent: #f7c948; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ground); color: var(--ink); font-family: "Jua", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .stage { position: relative; height: min(88vh, calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #painting-canvas { width: 100%; height: 100%; display: block; }
  #play { position: absolute; inset: 0; border: 0; background: rgba(11,20,40,.45); color: var(--ink); font: inherit; font-size: clamp(22px, 4vh, 36px); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #play span { font-size: 2.4em; color: var(--accent); }
  #play[hidden] { display: none; }
  .credit { max-width: 640px; font-family: system-ui, sans-serif; font-size: 12px; opacity: .65; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="painting-canvas" width="1080" height="1920"></canvas>
    <button id="play" disabled><span>▶</span><em id="play-label">불러오는 중…</em></button>
  </div>
  <p class="credit">Photos via Wikimedia Commons, repainted: simon berger (CC0) · Top Budapest (CC BY 2.0) · U.S. Army 241MPAD (PD) · Ljiljana Krupanj (CC BY 4.0) · epSos.de (CC BY 2.0)<br />Music, lyrics and painting code: original. Fonts: Jua, Mountains of Christmas (SIL OFL).</p>
  <audio id="carol" src="assets/carol.wav" preload="auto"></audio>
<script>
    (function () {
      const W = 1080, H = 1920, DUR = 30;
      const KO = '"Jua"', EN = '"Mountains of Christmas"';
      // Lyrics: [text, start, end, centre y, max width, colour set, font, weight]
      const LINES = [
        ["첫눈이 와요", -1, 4.5, 820, 900, "cream", KO, 400],
        ["마켓에 불이 켜지면", 4.5, 9, 400, 940, "cream", KO, 400],
        ["선물 든 아이들", 9, 13.5, 400, 900, "cream", KO, 400],
        ["손 잡은 연인들", 13.5, 18, 400, 900, "cream", KO, 400],
        ["반짝 반짝", 18, 21, 400, 860, "gold", KO, 400],
        ["별이 떠요", 21, 24, 400, 800, "gold", KO, 400],
        ["Merry", 24, 31, 300, 700, "cream", EN, 700],
        ["Christmas", 24.35, 31, 470, 980, "red", EN, 700],
      ];
      // Photos, repainted as dabs: [file, start, end, focus x (0-1), y offset]
      const PHOTOS = [
        ["snow", -1, 4.5, 0.5, 0],
        ["market", 4.5, 9, 0.55, 0],
        ["kids", 9, 13.5, 0.47, 0],
        ["couple", 13.5, 18, 0.5, 0],
        ["tree", 18, 31, 0.59, 520],
      ];
      const STAR = { x: 487, y: 654 };
      const PAL = {
        sky: ["#16294a", "#1f3a5f", "#2b4c7e", "#243f6b", "#3d5a80", "#1b2f55", "#4a6a96"],
        snow: ["#f4f1ea", "#e3e6f0", "#cfd6e8", "#b9b4d6", "#dcd3e8"],
        cream: ["#fff6e0", "#fbe9c2", "#ffefd0", "#f6dfae", "#ffffff"],
        gold: ["#f7c948", "#f2a93b", "#ffd970", "#e8913a", "#fff0b0"],
        red: ["#e0283e", "#f04a4f", "#c8102e", "#ff6a5f", "#e53a44"],
      };
      // Seeded PRNG (mulberry32).
      let seed = 1225;
      const rnd = () => {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const pick = (a) => a[Math.floor(rnd() * a.length)];
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

      const canvas = document.getElementById("painting-canvas");
      const ctx = canvas.getContext("2d");
      ctx.lineCap = "round";

      // ---- Background sky: swirling dabs, seen above the tree photo.
      const bg = [];
      for (let i = 0; i < 3200; i++) {
        const x = rnd() * W, y = rnd() * 1500;
        const a = Math.sin(x * 0.006 + y * 0.004) * 0.9 + Math.cos(y * 0.009) * 0.5;
        bg.push({ x, y, a, len: 14 + rnd() * 22, w: 7 + rnd() * 7, c: pick(PAL.sky), ph: rnd() * 6.28 });
      }

      // ---- Photo layers.
      const layers = [];
      function samplePhoto(img, [name, start, end, fx, oy]) {
        const scale = Math.max(W / img.width, (H - oy) / img.height);
        const sw = W / scale, sx = clamp(fx * img.width - sw / 2, 0, img.width - sw);
        const off = document.createElement("canvas");
        off.width = W; off.height = H;
        const g = off.getContext("2d");
        g.drawImage(img, sx, 0, sw, img.height, 0, oy, W, img.height * scale);
        const data = g.getImageData(0, 0, W, H).data, strokes = [];
        const step = 8;
        for (let y = oy; y < H; y += step) {
          for (let x = 0; x < W; x += step) {
            const jx = clamp(x + (rnd() - 0.5) * 6, 0, W - 1), jy = clamp(y + (rnd() - 0.5) * 6, 0, H - 1);
            const i = (Math.floor(jy) * W + Math.floor(jx)) * 4;
            if (data[i + 3] < 200) continue;
            // Feather a photo's top edge into the sky instead of a hard line.
            if (oy > 0 && jy < oy + 160 && rnd() > (jy - oy) / 160) continue;
            const r = data[i], gr = data[i + 1], b = data[i + 2];
            const lum = (r + gr + b) / 765;
            // Darken toward the lyric band so the type reads; keep the highlights warm.
            const k = 0.62 + 0.25 * lum, j = (rnd() - 0.5) * 30;
            const c = `rgb(${clamp(r * k + j, 0, 255) | 0},${clamp(gr * k + j, 0, 255) | 0},${clamp(b * k + j * 0.8 + 10, 0, 255) | 0})`;
            strokes.push({
              x: jx, y: jy, a: 0.6 + (rnd() - 0.5) * 1.2 + Math.sin(jy * 0.01) * 0.3,
              len: 5 + rnd() * 6 + lum * 4, w: 8 + rnd() * 4, c,
              d: start + 0.9 * rnd() + 0.2 * ((H - jy) / H), out: end - 0.4 + rnd() * 0.3,
              vx: (rnd() - 0.5) * 140, vy: 40 + rnd() * 160,
            });
          }
        }
        layers.push({ strokes, start, end });
      }

      // ---- Snow: falling dabs.
      const snow = [];
      for (let i = 0; i < 380; i++) {
        snow.push({ x0: rnd() * W, y0: rnd() * 2100, v: 50 + rnd() * 70, sw: 10 + rnd() * 25,
          f: 0.4 + rnd() * 0.9, len: 4 + rnd() * 5, w: 5 + rnd() * 5, c: pick(PAL.snow), ph: rnd() * 6.28 });
      }

      // ---- Star burst over the tree at 21 s.
      const rays = [];
      for (let i = 0; i < 260; i++) {
        const ang = rnd() * Math.PI * 2, dist = Math.pow(rnd(), 1.7) * 200;
        rays.push({ ang, dist, len: 10 + rnd() * 18, w: 5 + rnd() * 6, c: pick(PAL.gold), d: rnd() * 0.25 });
      }

      // ---- Lyrics: sample each line's glyphs into brush strokes.
      const words = [];
      function sampleLine([text, start, end, cy, maxW, set, family, weight]) {
        const off = document.createElement("canvas");
        off.width = W; off.height = 440;
        const o = off.getContext("2d");
        let size = 250;
        o.font = `${weight} ${size}px ${family}`;
        size = Math.min(250, (size * maxW) / o.measureText(text).width);
        o.font = `${weight} ${size}px ${family}`;
        o.textAlign = "center"; o.textBaseline = "middle";
        o.fillStyle = "#fff";
        o.fillText(text, W / 2, 220);
        const img = o.getImageData(0, 0, W, 440).data;
        const step = 6, strokes = [];
        const baseA = (rnd() - 0.5) * 0.5;
        for (let y = 0; y < 440; y += step) {
          for (let x = 0; x < W; x += step) {
            const jx = x + (rnd() - 0.5) * 3, jy = y + (rnd() - 0.5) * 3;
            if (jy < 0 || jy >= 440) continue;
            if (img[(Math.floor(jy) * W + Math.floor(jx)) * 4 + 3] < 140) continue;
            strokes.push({
              x: jx, y: cy - 220 + jy, a: baseA + (rnd() - 0.5) * 0.9, len: 4 + rnd() * 4, w: 6 + rnd() * 2.5,
              c: pick(PAL[set]), d: start + 0.55 * (jx / W) + rnd() * 0.18,
              vx: (rnd() - 0.5) * 160, vy: 60 + rnd() * 220, out: end - 0.55 + rnd() * 0.15,
            });
          }
        }
        words.push({ strokes, start, end });
      }

      function dab(x, y, a, len, w, c, alpha) {
        if (alpha <= 0.01) return;
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = c;
        ctx.lineWidth = w;
        const dx = Math.cos(a) * len, dy = Math.sin(a) * len;
        ctx.beginPath();
        ctx.moveTo(x - dx, y - dy);
        ctx.lineTo(x + dx, y + dy);
        ctx.stroke();
      }

      function draw(t) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#16294a";
        ctx.fillRect(0, 0, W, H);
        for (const s of bg) dab(s.x, s.y, s.a + 0.06 * Math.sin(t * 1.1 + s.ph), s.len, s.w, s.c, 0.92);

        for (const L of layers) {
          if (t < L.start - 0.1 || t > L.end + 1.4) continue;
          for (const s of L.strokes) {
            const pin = easeOut((t - s.d) / 0.3);
            if (pin <= 0) continue;
            const q = clamp((t - s.out) / 1.1, 0, 1);
            if (q >= 1) continue;
            dab(s.x + s.vx * q, s.y + s.vy * q, s.a + q * 1.5, s.len * pin, s.w, s.c, pin * (1 - q));
          }
        }

        if (t >= 21) {
          for (const r of rays) {
            const p = easeOut((t - 21 - r.d) / 0.6);
            const dist = r.dist * p;
            dab(STAR.x + Math.cos(r.ang) * dist, STAR.y + Math.sin(r.ang) * dist, r.ang, r.len, r.w, r.c,
              p * (r.dist > 110 ? 0.55 : 1));
          }
        }

        for (const s of snow) {
          const y = ((s.y0 + s.v * t) % 2100) - 90;
          const x = s.x0 + Math.sin(t * s.f + s.ph) * s.sw;
          dab(x, y, 0.4, s.len, s.w, s.c, 0.8);
        }

        for (const wd of words) {
          if (t < wd.start - 0.6 || t > wd.end + 1.6) continue;
          for (const pass of [0, 1]) {
            for (const s of wd.strokes) {
              const pin = easeOut((t - s.d) / 0.22);
              if (pin <= 0) continue;
              const q = clamp((t - s.out) / 1.4, 0, 1);
              if (q >= 1) continue;
              const x = s.x + s.vx * q, y = s.y + s.vy * q + 120 * q * q;
              const len = s.len * pin * (1 - q * 0.6);
              // Pass 0 lays a dark under-stroke so the type holds over any photo.
              if (pass === 0) dab(x + 5, y + 6, s.a, len + 3, s.w + 6, "#0b1428", 0.55 * pin * (1 - q));
              else dab(x, y, s.a + q * 2, len, s.w * (1 - q * 0.4), s.c, pin * (1 - q));
            }
          }
        }

        ctx.globalAlpha = 0.06;
        ctx.drawImage(grain, 0, 0);
        ctx.globalAlpha = 1;
      }

      const grain = document.createElement("canvas");
      grain.width = W; grain.height = H;
      {
        const g = grain.getContext("2d");
        for (let i = 0; i < 26000; i++) {
          g.fillStyle = rnd() < 0.5 ? "#000" : "#fff";
          g.fillRect(rnd() * W, rnd() * H, 2, 2);
        }
      }

      const loadImg = (name) => new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = `assets/photos/${name}.jpg`;
      });
      const ready = Promise.all([
        document.fonts.load('400 200px "Jua"', "첫눈이 와요"),
        document.fonts.load('700 200px "Mountains of Christmas"', "Merry"),
        ...PHOTOS.map((p) => loadImg(p[0])),
      ]).then((res) => {
        const imgs = res.slice(2);
        PHOTOS.forEach((p, i) => samplePhoto(imgs[i], p));
        LINES.forEach(sampleLine);
        draw(0);
        window.__paint = draw;
        window.dispatchEvent(new Event("paint-ready"));
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["painting"] = ready;
    })();
  </script>
<script>
  const audio = document.getElementById("carol"), play = document.getElementById("play"), label = document.getElementById("play-label");
  let raf = 0;
  function loop() { window.__paint(audio.currentTime); if (!audio.paused) raf = requestAnimationFrame(loop); }
  function enable() { play.disabled = false; label.textContent = "재생"; }
  if (window.__paint) enable(); else window.addEventListener("paint-ready", enable);
  play.addEventListener("click", () => { if (audio.ended) audio.currentTime = 0; audio.play(); play.hidden = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); });
  audio.addEventListener("ended", () => { window.__paint(30); play.hidden = false; label.textContent = "다시 보기"; });
  document.querySelector(".stage").addEventListener("click", (e) => { if (e.target === play || play.hidden === false) return; audio.pause(); play.hidden = false; label.textContent = "이어서 재생"; });
</script>
</body>
</html>
